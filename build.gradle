// Simplified build script for Minecraft 1.20.8 update demonstration
// Note: This shows the structure needed for 1.20.8 but uses simplified dependencies
// due to network access limitations in this environment

plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext.Versions = new Properties()
// Load version properties for 1.20.8
def versionFile = file("Versionfiles/mcversion-1.20.8.properties")
if (versionFile.exists()) {
    Versions.load(versionFile.newReader())
} else {
    // Fallback versions for 1.20.8
    Versions.setProperty('minecraft_version', '1.20.8')
    Versions.setProperty('fabric_versiononly', '0.98.0')
}

def projectVersion = "1.4"
version = "${Versions['minecraft_version']}-fabric${Versions['fabric_versiononly']}-${projectVersion}"

// Note: For a real Fabric build, you would need:
// - fabric-loom plugin with proper version
// - Access to maven.fabricmc.net
// - Minecraft mappings and Fabric API dependencies
// This simplified version demonstrates the structure for 1.20.8

dependencies {
    // Simplified dependencies - in real build these would be Fabric dependencies
    implementation 'org.slf4j:slf4j-api:1.7.36'
}

jar {
    from("LICENSE") {
        include "LICENSE"
    }
    
    manifest {
        attributes([
            'Implementation-Title': 'StepUp',
            'Implementation-Version': project.version,
            'Minecraft-Version': Versions['minecraft_version']
        ])
    }
}

// Print version info for verification
task versionInfo {
    doLast {
        println "Building StepUp for Minecraft ${Versions['minecraft_version']}"
        println "Version: ${project.version}"
        println "Fabric Version: ${Versions['fabric_versiononly']}"
    }
}

build.dependsOn versionInfo